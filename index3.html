<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación Completada</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wa-green:     #25D366;
      --wa-teal:      #128C7E;
      --wa-teal-dark: #075E54;
      --wa-panel-bg:  #f0f2f5;
      --wa-white:     #FFFFFF;
      --wa-text:      #111B21;
      --wa-text-gray: #667781;
      --wa-border:    #D1D7DB;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; font-family:'Inter',sans-serif; background:var(--wa-panel-bg); overflow:hidden; }
    body { display:flex; align-items:center; justify-content:center; padding:20px; min-height:100vh; }

    body::before {
      content:''; position:fixed; inset:0; z-index:0;
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d1d7db' fill-opacity='0.25'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    .card {
      position:relative; z-index:1;
      width:100%; max-width:460px;
      background:var(--wa-white);
      border-radius:16px; padding:52px 44px;
      box-shadow:0 8px 40px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.06);
      display:flex; flex-direction:column; align-items:center;
      animation:rise .5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes rise { from{opacity:0;transform:translateY(20px) scale(.97)} to{opacity:1;transform:none} }

    /* WhatsApp logo badge */
    .logo-badge {
      display:flex; align-items:center; gap:8px;
      margin-bottom:24px;
    }
    .logo-badge-icon { width:36px; height:36px; border-radius:10px; background:var(--wa-teal); display:flex; align-items:center; justify-content:center; }
    .logo-badge-icon svg { width:20px; height:20px; fill:white; }
    .logo-badge-text { font-size:16px; font-weight:700; color:var(--wa-teal-dark); }

    /* Success icon */
    .icon-wrap {
      width:76px; height:76px; border-radius:50%; margin-bottom:24px;
      background:var(--wa-green);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 6px 24px rgba(37,211,102,0.35);
      animation:scaleIn .5s cubic-bezier(.16,1,.3,1) .15s both;
    }
    @keyframes scaleIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    .icon-wrap svg { width:38px; height:38px; fill:none; stroke:white; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

    .heading { font-size:23px; font-weight:700; color:var(--wa-text); text-align:center; margin-bottom:6px; }
    .sub { font-size:13.5px; color:var(--wa-text-gray); text-align:center; margin-bottom:28px; line-height:1.5; }

    /* Check list */
    .checks { width:100%; display:flex; flex-direction:column; gap:9px; margin-bottom:28px; }
    .check-item {
      display:flex; align-items:center; gap:12px;
      padding:12px 14px; border-radius:10px;
      background:#f0fdf4; border:1px solid #bbf7d0;
    }
    .check-icon { width:26px; height:26px; border-radius:50%; flex-shrink:0; background:var(--wa-teal); display:flex; align-items:center; justify-content:center; }
    .check-icon svg { width:13px; height:13px; fill:none; stroke:white; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .check-text { font-size:13px; font-weight:600; color:var(--wa-teal-dark); }

    /* Timer */
    .timer-box {
      width:100%; background:var(--wa-panel-bg);
      border:1.5px solid var(--wa-border);
      border-radius:12px; padding:18px 22px;
      display:flex; flex-direction:column; align-items:center; gap:5px;
    }
    .timer-label { font-size:11px; font-weight:600; color:var(--wa-text-gray); letter-spacing:0.4px; text-transform:uppercase; }
    .timer-num { font-size:48px; font-weight:700; color:var(--wa-teal); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:1px; }
    .timer-note { font-size:11px; color:var(--wa-text-gray); text-align:center; }

    @media (max-width:480px) { .card { padding:36px 24px; border-radius:12px; } .timer-num { font-size:40px; } }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-badge">
      <div class="logo-badge-icon">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      </div>
      <span class="logo-badge-text">WhatsApp</span>
    </div>

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>

    <h1 class="heading">¡Verificación Completada!</h1>
    <p class="sub">Tu identidad ha sido confirmada exitosamente. Serás redirigido en breve.</p>

    <div class="checks">
      <div class="check-item">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="check-text">Número de teléfono verificado</div>
      </div>
      <div class="check-item">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="check-text">Código de WhatsApp confirmado</div>
      </div>
      <div class="check-item">
        <div class="check-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="check-text">Sesión iniciada correctamente</div>
      </div>
    </div>

    <div class="timer-box">
      <div class="timer-label">Redirigiendo en</div>
      <div class="timer-num" id="countdown">10</div>
      <div class="timer-note">segundos</div>
    </div>
  </div>

  <script>
    let t = 10;
    const el = document.getElementById('countdown');
    const tick = setInterval(() => {
      t--;
      el.textContent = t;
      if (t <= 0) { clearInterval(tick); }
    }, 1000);
  </script>
</body>
</html>
